name: echo
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  rounded_loading_button_plus: ^3.0.1
  getwidget: ^7.0.0
  page_transition: ^2.2.1
  responsive_sizer: ^3.3.1
  animated_bottom_navigation_bar: ^1.4.0
  font_awesome_flutter: ^10.8.0
  sleek_circular_slider: ^2.1.0
  awesome_dialog: ^3.2.1
  flutter_staggered_grid_view: ^0.7.0
  focused_menu: ^1.0.5
  flutter_balloon_slider: ^0.1.1
  expandable_text: ^2.3.0
  list_tile_more_customizable: ^3.0.0
  photo_view: ^0.15.0
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  achievement_view: ^1.0.1
  cloud_firestore: ^6.0.1
  loading_animation_widget: ^1.3.0
  provider: ^6.1.5+1
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  image: ^4.5.4
  uuid: ^4.5.1
  firebase_storage: ^13.0.1
  supabase: ^2.9.1
  supabase_flutter: ^2.10.1
  badges: ^3.1.2
  intl: ^0.20.2
  emoji_picker_flutter: ^4.3.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.2
  staggered_grid_view: ^0.0.1
  google_sign_in_android: ^7.2.6
  record: ^6.1.2
  permission_handler: ^12.0.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  http: ^1.6.0
  googleapis_auth: ^2.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:


  uses-material-design: true

  assets:
   - assets/images/
  
flutter_native_splash:
  color: "#000000"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  android_12:
    image: assets/images/splash_logo.png
    color: "#000000"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/echo_final.png"
